<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Black & White Gallery</title>
    
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/css/nanogallery2.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">


      <!-- This is the Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    

</head>
<body>


    <header>
        <h1 class="text-center p-5">Museum Black & White Gallery</h1>
        
        <div  class="text-center">
            <button class="about-button" onclick="toggleSections('gallery-section')">Gallery</button>
            <button class="about-button" onclick="toggleSections('about-section')">About</button>
            <button class="about-button" onclick="toggleSections('fame-section')">Hall of fame</button>
            <button class="about-button" onclick="toggleSections('restore-section')">Restoration</button>
        </div>
        <hr class="pb-4">
    </header>

    <section>
        <div id="gallery-section" class="all-sections">

            <div class="d-flex justify-content-center align-items-center">
                <input class="search-bar"
                type="text"
                id="gallery-search"
                placeholder="Search..."
                style="width: 300px; margin: 20px auto; display: block;">

                <button class="filter-button" onclick="toggleFilters()"><i class="ri-equalizer-fill "></i></button>
                
            </div>

        <div class="container mb-4" id="filter-bar">
            <div class="row g-2 justify-content-center">

                <div class="col-md-2">
                    <select id="f-manufacturer" class="form-select filter-ctrl about-button">
                        <option value="">Manufacturer</option>
              
                    </select>
                </div>

     
                <div class="col-md-2">
                    <select id="f-acq-country" class="form-select filter-ctrl about-button">
                        <option value="">Acquisition Country</option>
                    </select>
                </div>

       
                <div class="col-md-2">
                    <select id="f-origin-country"  class="form-select filter-ctrl about-button">
                        <option value="">Origin Country</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select id="f-prod-date" class="form-select filter-ctrl about-button">
                        <option value="">Production Date</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select id="f-condition" class="form-select filter-ctrl about-button">
                        <option value="">Condition</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select id="f-rarity" class="form-select filter-ctrl about-button">
                        <option value="">Rarity</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select id="f-material" class="form-select filter-ctrl about-button">
                        <option value="">Material</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select id="f-type" class="form-select filter-ctrl about-button">
                        <option value="">Type</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button class="btn  w-100 about-button" onclick="resetAllFilters()" title="Resetează tot">
                        <i class="ri-refresh-line"></i> Reset
                    </button>
                </div>
            </div>
        </div>

            <div id="my-gallery"></div>
            


        </div>
        <div id="about-section" class="all-sections" style="display:none;">
            <h1 class="text-center p-5">About</h1>
        </div>
        <div id="fame-section" class="all-sections" style="display:none;">
            <h1 class="text-center p-5">Hall of fame</h1>
        </div>
        <div id="restore-section" class="all-sections" style="display:none;">
            <h1 class="text-center p-5">Restoration</h1>
        </div>
    </section>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasEnd"   data-bs-scroll="true"  data-bs-backdrop="false"  aria-labelledby="offcanvasEndLabel">
        <div class="offcanvas-body">
            <div>
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ab assumenda ea est, eum exercitationem fugiat illum itaque laboriosam magni
            necessitatibus, nemo nisi numquam quae reiciendis repellat sit soluta unde. Aut!
            </div>
        </div>
    </div>





    <!-- SCRIPTS -->
    <script src="static/js/script.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/jquery.nanogallery2.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    let globalData;
    $(document).ready(function () {
        $.getJSON("data/gallery.json", function (data) {
            globalData = data;

            data.forEach(item =>{
                item.customData = item.properties;
            })
            const filters = {
                '#f-manufacturer': 'manufacturer',
                '#f-acq-country': 'acquisition_country',
                '#f-origin-country': 'origin_country',
                '#f-prod-date': 'production_date',
                '#f-condition': 'condition',
                '#f-rarity': 'rarity',
                '#f-material': 'material',
                '#f-type': 'type'
            };

            Object.keys(filters).forEach(selector => {
                const propName = filters[selector];
                let uniqueValues = [...new Set(data.map(item => item.properties[propName]))].sort();
                
                uniqueValues.forEach(val => {
                    if(val) $(selector).append(`<option value="${val}">${val}</option>`);
                });
            });

            

            $("#my-gallery").nanogallery2({
                items: data,
                thumbnailHeight: 350,
                thumbnailWidth: 650,
                galleryDisplayMode: 'grid',
                galleryFilterTagsMode: 'AND',
                thumbnailHoverEffect2: 'labelAppear',
                viewerTheme : { zIndex: 999 },
                viewerToolbar:{
                    display: true,
                    standard:'downloadButton, label, custom1',
                },

                viewerTools: {
                    topLeft: 'playPauseButton, custom2, custom3', 
                    topRight: 'fullscreenButton, closeButton' 
                },
                
                viewerGallery: {
                    display: false
                },

                slideshowDelay:3000,
 

                fnImgDisplayed: myViewerEveryTime, 
                fnImgToolbarCustClick: myToolbarCustClick,
                fnGalleryLayoutApplied: myViewerAfterHide,


                icons: { 
                    viewerCustomTool1: '<i class="ri-info-i" style="font-size:26px"></i>',
                    viewerCustomTool2: '2"<i class="ri-play-fill"></i>',
                    viewerCustomTool3: '3"<i class="ri-play-fill"></i>'
                }
            });

            

            function myViewerAfterHide(){

                var element = document.getElementById('offcanvasEnd');
                var isOpen = element.classList.remove('show');
                
            }

            function myViewerEveryTime(item){

                var element = document.getElementById('offcanvasEnd');
                var isOpen = element.classList.contains('show');

                if (isOpen) {
                    actualizeazaContinutOffcanvas(item);
                }
                
            }


            function myviewerToolsCustClick(buttonName){

                if (buttonName === 'custom1'){
                    var element = document.getElementById('offcanvasEnd');
                    var bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(element);

                    actualizeazaContinutOffcanvas(item);
                    bsOffcanvas.toggle();

                    console.log("ceva",item)
                        
                }
            }



            function myToolbarCustClick(buttonName, customIcon, item) {

                //de cautat in  global data obiectul cu acest src

                function search(src, dataArray){
                    for (let i=0; i < dataArray.length; i++){
                        if (dataArray[i].src === src){
                            return dataArray[i];
                        }
                    }
                }

                const currentItem = search(item.src, globalData)

                
           
                if (buttonName === 'custom1'){
                    var element = document.getElementById('offcanvasEnd');
                    var bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(element);
                    actualizeazaContinutOffcanvas(item);
                    bsOffcanvas.toggle();
                        
                }

            }


            function actualizeazaContinutOffcanvas(item){
                const props = item.customData;
                 console.log("Obiectul item complet:", item.customData);
                

                     $('.offcanvas-body').html(`
                        <h4>${item.title || 'Fără titlu'}</h4>
                        <p class="text-muted">${item.description || 'Fără descriere'}</p>
                        <hr>
                        <div class="d-flex">
                            <ul class="list-unstyled me-5">
                                <li class="mb-2"><strong>Manufacturer:</strong> ${props.manufacturer || '-'}</li>
                                <li class="mb-2"><strong>Model:</strong> ${props.model_or_name || '-'}</li>
                                 <li class="mb-2"><strong>Material:</strong> ${props.material || '-'}</li>
                                <li class="mb-2"><strong>Condition</strong> ${props.condition || '-'}</li>
                                
                            </ul>
                            <ul class="list-unstyled">
                                <li class="mb-2"><strong>Origin Country:</strong> ${props.origin_country || '-'}</li>
                                <li class="mb-2"><strong>Production Date:</strong> ${props.production_date || '-'}</li>
                                <li class="mb-2"><strong>Acquisition Country:</strong> ${props.acquisition_country || '-'}</li>
                               <li class="mb-2"><strong>Raritate:</strong> ${props.rarity || '-'}</li>
                            </ul>
                        </div>
                        <ul class="list-unstyled">
                            <li class="mb-2"><strong>Details:</strong> ${props.details || '-'}</li>
                        </ul>
                    `);

            }

 
            function fillterGallery(){
                let filteredData = globalData.filter((item) => true);
                var value = $("#gallery-search").val().toLowerCase();
                console.log(value)

                Object.keys(filters).forEach(selector => {
                    let value = $(selector).val()
                    let property = filters[selector]

                    if(value == null || value == '') return;
                    filteredData = filteredData.filter(item => (item.properties.hasOwnProperty(property) && item.properties[property] == value) )
                });

                filteredData = filteredData.filter((item)  => {
                    return item.title.toLowerCase().includes(value)
                });

                



                $("#my-gallery").nanogallery2('destroy');
                $("#my-gallery").nanogallery2({
                    items: filteredData,
                    thumbnailHeight: 350,
                    thumbnailWidth: 650,
                    galleryDisplayMode: 'grid',
                    galleryFilterTagsMode: 'AND',
                    thumbnailHoverEffect2: 'labelAppear',
                    viewerTheme : { zIndex: 999 },
                    viewerToolbar:{
                        display: true,
                        standard:'downloadButton, label, custom1',
                    },

                    viewerTools: {
                        topLeft: 'playPauseButton, custom2, custom3', 
                        topRight: 'fullscreenButton, closeButton' 
                    },
                    
                    viewerGallery: {
                        display: false
                    },

                    slideshowDelay:3000,
    

                    fnImgDisplayed: myViewerEveryTime, 
                    fnImgToolbarCustClick: myToolbarCustClick,
                    fnGalleryLayoutApplied: myViewerAfterHide,


                    icons: { 
                        viewerCustomTool1: '<i class="ri-info-i" style="font-size:26px"></i>',
                        viewerCustomTool2: '2"<i class="ri-play-fill"></i>',
                        viewerCustomTool3: '3"<i class="ri-play-fill"></i>'
                    }
                });

            }



            $('.filter-ctrl').on('change', function() {
                fillterGallery()
            });
            

            $("#gallery-search").on("keyup", function() {              
                fillterGallery()
            });

    

            window.resetAllFilters = function() {
                $('.filter-ctrl').val('');
                $("#gallery-search").val('');
                $("#my-gallery").nanogallery2('filter', '');
                
                $("#my-gallery").nanogallery2('destroy');
                $("#my-gallery").nanogallery2({
                    items: data,
                    thumbnailHeight: 350,
                    thumbnailWidth: 650,
                    galleryDisplayMode: 'grid',
                    galleryFilterTagsMode: 'AND',
                    thumbnailHoverEffect2: 'labelAppear',
                    viewerTheme : { zIndex: 999 },
                    viewerToolbar:{
                        display: true,
                        standard:'downloadButton, label, custom1',
                    },

                    viewerTools: {
                        topLeft: 'playPauseButton, custom2, custom3', 
                        topRight: 'fullscreenButton, closeButton' 
                    },
                    
                    viewerGallery: {
                        display: false
                    },

                    slideshowDelay:3000,
    

                    fnImgDisplayed: myViewerEveryTime, 
                    fnImgToolbarCustClick: myToolbarCustClick,
                    fnGalleryLayoutApplied: myViewerAfterHide,


                    icons: { 
                        viewerCustomTool1: '<i class="ri-info-i" style="font-size:26px"></i>',
                        viewerCustomTool2: '2"<i class="ri-play-fill"></i>',
                        viewerCustomTool3: '3"<i class="ri-play-fill"></i>'
                    }
                });
                };

        });

    });

    </script>


</body>
</html>
